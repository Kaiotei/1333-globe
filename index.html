<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globe</title>
<meta name="description" content="A holographic three.js globe for a landing page: land, halo, grid, arcs and labelled city nodes.">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
        background: radial-gradient(ellipse at 50% 45%, #e0ccf8 0%, #c4a8e8 45%, #96799c 100%);
        font-family: 'MS UI Gothic', Arial, sans-serif;
    }
    /* ===== GLOBE ===== */
    #globeContainer {
        position: fixed; inset: 0; z-index: 2;
        pointer-events: none;
    }
    #globeCanvas { display: block; width: 100%; height: 100%; }
    /* floating text over 3D: --text-dark fill with a white glow (15.0) */
    .globe-city-label {
        position: absolute; left: 0; top: 0;
        font-family: 'MS UI Gothic', Arial, sans-serif;
        font-size: 9px; font-weight: bold; letter-spacing: 1px;
        color: #322036;
        text-shadow: 0 0 3px #fff, 0 0 6px #fff, 0 0 10px rgba(255,255,255,0.8);
        pointer-events: none; white-space: nowrap;
        will-change: transform, opacity;
    }
    .globe-scanlines {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(0,0,0,0.045) 3px,
            rgba(0,0,0,0.045) 4px
        );
        pointer-events: none;
        z-index: 3;
    }
    @keyframes globeGlitchAnim {
        0%, 88%, 100% { clip-path: none; transform: none; filter: none; }
        89% { clip-path: inset(32% 0 38% 0); transform: translateX(-5px); filter: hue-rotate(50deg) brightness(1.35); }
        90% { clip-path: inset(12% 0 58% 0); transform: translateX(5px); filter: hue-rotate(-50deg); }
        91% { clip-path: none; transform: none; filter: none; }
        94% { clip-path: inset(52% 0 18% 0); transform: translateX(-3px); filter: brightness(1.25) saturate(2); }
        95% { clip-path: none; transform: none; filter: none; }
    }
    #globeContainer { animation: globeGlitchAnim 14s infinite; }
    @media (prefers-reduced-motion: reduce) { #globeContainer { animation: none; } }

    .caption {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10;
        font-size: 11px; font-weight: bold; letter-spacing: 2px; color: #322036;
        text-shadow: 0 0 3px #fff, 0 0 6px #fff;
    }
    .caption a { color: inherit; }
</style>
</head>
<body>
    <div id="globeContainer">
        <canvas id="globeCanvas"></canvas>
    </div>
    <div class="globe-scanlines"></div>
    <p class="caption">globe ◆ from <a href="https://1333covenant.com">13 &lt;33 Covenant</a></p>
    <script type="module" src="globe.js"></script>
</body>
</html>
